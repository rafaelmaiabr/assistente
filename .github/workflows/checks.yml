name: Checks
# One run per change (#153): pull requests, and pushes only to main. A new commit on the same ref cancels the older run.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    # The Python suite in 3 parallel slices (scripts/test_shard.py); `configuration` below proves the slices are the whole suite.
    name: tests (${{ matrix.shard }}/3)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp==3.14.5 tzdata==2026.5
      - run: python scripts/test_shard.py --shard ${{ matrix.shard }} --of 3
  configuration:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - name: The test slices must all pass
        if: ${{ needs.tests.result != 'success' }}
        run: |
          Write-Error "A fatia de testes falhou ou foi cancelada: ${{ needs.tests.result }}"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp==3.14.5 tzdata==2026.5
      - name: The slices together are the whole suite, each test once
        run: python scripts/test_shard.py --check --of 3
      - run: python scripts/run_evals.py --markdown evals-report.md
      - run: Get-Content evals-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        if: always() && hashFiles('evals-report.md') != ''
      - run: python -m compileall -q agent.py assistant_core.py personal_mail.py personal_outbox.py browser_agent.py web_server.py team/web.py speech_service.py voice_profiles.py voice_engine.py local_audio.py demo_mcp.py settings.py verificar.py team scripts/export_team_schemas.py scripts/smoke_vault.py scripts/mail_setup.py scripts/smoke_ollama.py scripts/smoke_team_runtime.py scripts/eval_triage.py scripts/run_evals.py scripts/remote_setup.py scripts/pg_migrate.py scripts/run_tests_postgres.py scripts/translate_migrations_pg.py evals
  postgres:
    # Contract, queue, migration and service tests on a real PostgreSQL. The service is an ephemeral container of this job only;
    # its password is a throw-away value for it (docs/TEAM-POSTGRES.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assistente
          POSTGRES_PASSWORD: senha-descartavel-da-ci
          POSTGRES_DB: assistente_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assistente -d assistente_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ASSISTENTE_TEST_POSTGRES_DSN: postgresql://assistente:senha-descartavel-da-ci@127.0.0.1:5432/assistente_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp==3.14.5 tzdata==2026.5 -r requirements-postgres.txt
      - run: python scripts/translate_migrations_pg.py --check
      - run: python -m unittest tests.test_team_repository_pg tests.test_team_queue_limits tests.test_team_pgmigrate -v
      - run: python scripts/run_tests_postgres.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test desktop/tests/*.test.cjs
      - run: node --check desktop/main.cjs
      - run: node --check desktop/preload.cjs
