name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp==3.14.5
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agent.py assistant_core.py browser_agent.py web_server.py team/web.py speech_service.py voice_profiles.py voice_engine.py local_audio.py demo_mcp.py settings.py verificar.py team scripts/export_team_schemas.py scripts/smoke_vault.py scripts/smoke_ollama.py scripts/smoke_team_runtime.py scripts/eval_triage.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test desktop/tests/*.test.cjs
      - run: node --check desktop/main.cjs
      - run: node --check desktop/preload.cjs
