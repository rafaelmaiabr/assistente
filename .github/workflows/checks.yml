name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agent.py local_audio.py demo_mcp.py settings.py verificar.py
